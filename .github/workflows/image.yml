name: image

on:
  push:
    tags:
      - "v*"
  # A pull request that changes what goes into the image proves it still builds and boots, without publishing.
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - .github/workflows/image.yml
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing version tag to build and publish, such as v0.22.0"
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit, not tag: a tag can be moved to point at other code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      # The image is built once for the runner's own platform and run: the smoke test proves Node, the dependencies and the start script inside it, without a Discord token.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build for the runner
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: claudetalk:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: boot the image without a token
        run: |
          set -uo pipefail
          output="$(docker run --rm claudetalk:smoke 2>&1)" && { echo "started without a token"; exit 1; }
          echo "$output" | grep -q "DISCORD_BOT_TOKEN is not set" || { echo "$output"; exit 1; }
          docker run --rm claudetalk:smoke claude --version
      # Run as a newcomer runs it, over the image just built: an untouched .env.example has to reach the same refusal.
      - name: boot it through the compose file
        run: |
          set -uo pipefail
          cp .env.example .env
          echo "PROJECTS_DIR=$RUNNER_TEMP" >> .env
          docker tag claudetalk:smoke ghcr.io/guappa/claudetalk:latest
          output="$(docker compose run --rm claudetalk 2>&1)" && { echo "started without a token"; exit 1; }
          echo "$output" | grep -q "DISCORD_BOT_TOKEN is not set" || { echo "$output"; exit 1; }

      - name: publish
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: name the image after the tag
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}
            type=raw,value=latest
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: github.event_name != 'pull_request'
      # arm64 covers the small always-on boxes this image is for: a Raspberry Pi, a NAS.
      - name: build for both platforms and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
