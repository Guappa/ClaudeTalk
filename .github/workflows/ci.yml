name: ci

on:
  # A branch push and its pull request are the same commit, so only main triggers on push.
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository, so the token gets no more than reading it.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      # Every job bills a whole minute however short it is, and Windows bills two.
      matrix:
        include:
          # The floor this package claims, the current LTS, and the line that becomes LTS next.
          - { os: ubuntu-latest, node: "22" }
          - { os: ubuntu-latest, node: "24" }
          - { os: ubuntu-latest, node: "26" }
          # Windows is here for path and process semantics, which do not vary by Node version.
          - { os: windows-latest, node: "24" }
    runs-on: ${{ matrix.os }}
    steps:
      # Pinned by commit, not tag: a tag can be moved to point at other code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Vitest accepts syntax Node's type stripper rejects, so the suite passing does not show the bridge starts.
      - run: npm run check:boot
      - run: npm run knip
      - run: npm run dupes
      - run: npm run check:private

      # The scripts and the workflows are code no step above reads. Once is enough: none of it varies by Node version, and the runner image brings shellcheck and PSScriptAnalyzer.
      - name: lint the shell scripts
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: shellcheck scripts/*.sh
      - name: lint the PowerShell scripts
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        shell: pwsh
        run: |
          $found = Invoke-ScriptAnalyzer -Path scripts -Recurse
          $found | Format-Table -AutoSize -Wrap
          if ($found) { exit 1 }
      # Fetched by version and held to their published checksums, for the reason the actions above are pinned by commit.
      - name: lint the Dockerfile
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/hadolint" "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  $RUNNER_TEMP/hadolint" | sha256sum --check --quiet
          chmod +x "$RUNNER_TEMP/hadolint"
          "$RUNNER_TEMP/hadolint" Dockerfile
        env:
          HADOLINT_VERSION: "2.15.1"
          HADOLINT_SHA256: "c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507"
      - name: lint the workflows
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tar.gz" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --quiet
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
